<!doctype html>
<html lang="bn">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" type="image/png" href="logo.svg">
<link rel="apple-touch-icon" href="logo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>My Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;padding-bottom:68px}
header{position:sticky;top:0;z-index:10;background:#0f0f0f;padding:12px;border-bottom:1px solid #292929}
.top{display:flex;align-items:center;margin-bottom:10px}.logo{font-size:21px;font-weight:bold;flex:1}.logo b{color:#f33}
.search{display:flex;gap:7px}.search input{flex:1;min-width:0;padding:11px 15px;border-radius:24px;border:1px solid #444;background:#222;color:#fff;outline:0}.search button{border:0;border-radius:24px;padding:0 16px;font-weight:bold}
.page{display:none}.page.active{display:block}.heading{font-size:19px;font-weight:bold;padding:15px 12px 3px}
.card{margin:12px;background:#181818;border-radius:12px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:10px 12px 13px}.title{font-weight:bold;line-height:1.35}.channel{color:#aaa;font-size:13px;margin-top:6px}.actions{display:flex;gap:8px;margin-top:9px}.small{border:0;border-radius:18px;background:#292929;color:#fff;padding:7px 11px;font-size:12px}
.empty,.status{text-align:center;color:#aaa;padding:45px 20px}.more{text-align:center;padding:12px}.more button{border:0;border-radius:22px;padding:11px 18px;font-weight:bold}
.navbar{position:fixed;bottom:0;left:0;right:0;height:66px;background:#181818;border-top:1px solid #333;display:flex;z-index:20}.nav{flex:1;border:0;background:none;color:#999;font-size:12px}.nav b{display:block;font-size:21px}.nav.active{color:#fff}
#playerBox{display:none;position:fixed;inset:0;background:#000;z-index:100}.playerTop{height:52px;background:#111;display:flex;align-items:center;gap:10px;padding:0 10px}.close{border:0;background:none;color:#fff;font-size:30px}.ptitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.pipbtn{border:0;background:#292929;color:#fff;border-radius:18px;padding:7px 10px}
#player{width:100%;height:calc(100vh - 52px);border:0}
.theme{width:40px;height:40px;border:0;border-radius:50%;background:#222;color:#fff;font-size:19px}
.light{background:#f5f5f5;color:#111}.light header,.light .navbar{background:#fff;border-color:#ddd}.light .card{background:#fff}.light .search input{background:#eee;color:#111}.light .small,.light .theme{background:#eee;color:#111}.light .nav{color:#666}.light .nav.active{color:#111}
.note{margin:12px;padding:12px;border-radius:10px;background:#191919;color:#aaa;font-size:13px;line-height:1.5}
</style></head>
<body>
<header>
  <img src="logo.svg" alt="M+R Logo" style="width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 4px 16px rgba(255,0,0,.25);"><div class="top"><div class="logo"><b>▶</b> My Video</div><button class="theme" onclick="theme()">☼</button></div>
<div class="search"><input id="q" placeholder="YouTube ভিডিও সার্চ করুন"><button onclick="search(false)">Search</button></div></header>

<section id="home" class="page active"><div class="heading">হোম</div><div class="note">ভিডিও চালানোর সময় fullscreen বা, আপনার ব্রাউজার/ডিভাইস সমর্থন করলে, Picture-in-Picture ব্যবহার করতে পারবেন।</div><div class="empty">উপরে ভিডিওর নাম লিখে Search করুন।</div></section>
<section id="searchPage" class="page"><div class="heading">সার্চ ফলাফল</div><div id="results"></div><div id="more" class="more" style="display:none"><button onclick="search(true)">আরও ভিডিও</button></div></section>
<section id="historyPage" class="page"><div class="heading">History</div><div id="history"></div><div id="historyEmpty" class="empty">এখনো কোনো ভিডিও দেখা হয়নি।</div></section>
<section id="savedPage" class="page"><div class="heading">Watch Later / Saved</div><div id="saved"></div><div id="savedEmpty" class="empty">কোনো Saved ভিডিও নেই।</div></section>

<nav class="navbar"><button class="nav active" data-p="home"><b>⌂</b>Home</button><button class="nav" data-p="searchPage"><b>⌕</b>Search</button><button class="nav" data-p="historyPage"><b>◷</b>History</button><button class="nav" data-p="savedPage"><b>♡</b>Saved</button></nav>

<div id="playerBox">
<div class="playerTop"><button class="close" onclick="closePlayer()">×</button><div id="ptitle" class="ptitle">ভিডিও</div><button class="pipbtn" onclick="pip()">PiP</button></div>
<iframe id="player" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe>
</div>

<script>
const API_KEY="PASTE_YOUR_API_KEY_HERE";
let token="",query="";
const $=id=>document.getElementById(id);
const get=k=>JSON.parse(localStorage.getItem(k)||"[]");
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(p).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.p===p));if(p==="historyPage")draw("history","historyEmpty",get("history"));if(p==="savedPage")draw("saved","savedEmpty",get("saved"))}
document.querySelectorAll(".nav").forEach(x=>x.onclick=()=>show(x.dataset.p));

function card(v){
 let id=v.id?.videoId||v.id,s=v.snippet,saved=get("saved").some(x=>x.id===id);
 let d=document.createElement("div");d.className="card";
 d.innerHTML='<img class="thumb" src="'+esc(s.thumbnails?.high?.url||s.thumbnails?.medium?.url||"")+'"><div class="info"><div class="title">'+esc(s.title)+'</div><div class="channel">'+esc(s.channelTitle||"")+'</div><div class="actions"><button class="small play">▶ Play</button><button class="small save">'+(saved?"✓ Saved":"＋ Watch Later")+'</button></div></div>';
 d.querySelector(".thumb").onclick=d.querySelector(".title").onclick=d.querySelector(".play").onclick=()=>play(id,s.title,v);
 d.querySelector(".save").onclick=e=>{e.stopPropagation();toggle(v)};return d
}
function draw(id,empty,list){$(id).innerHTML="";$(empty).style.display=list.length?"none":"block";list.forEach(v=>$(id).appendChild(card(v)))}
function toggle(v){let id=v.id?.videoId||v.id,a=get("saved"),i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);else a.unshift({id,snippet:v.snippet});put("saved",a);draw("saved","savedEmpty",a)}
function play(id,title,v){let a=get("history").filter(x=>x.id!==id);a.unshift({id,snippet:v.snippet});put("history",a.slice(0,50));$("ptitle").textContent=title;$("player").src="https://www.youtube.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0";$("playerBox").style.display="block"}
function closePlayer(){$("player").src="";$("playerBox").style.display="none"}

async function search(more){
 let q=$("q").value.trim();if(!q)return;
 if(API_KEY==="PASTE_YOUR_API_KEY_HERE"){alert("index.html-এ API key বসাও");return}
 if(!more){query=q;token="";show("searchPage");$("results").innerHTML='<div class="status">খোঁজা হচ্ছে...</div>'}
 try{
  let p=new URLSearchParams({part:"snippet",q:query,type:"video",maxResults:"10",regionCode:"BD",videoEmbeddable:"true",key:API_KEY});
  if(token)p.set("pageToken",token);
  let r=await fetch("https://www.googleapis.com/youtube/v3/search?"+p),d=await r.json();
  if(!r.ok)throw Error(d.error?.message||"API error");
  token=d.nextPageToken||"";if(!more)$("results").innerHTML="";
  d.items.forEach(v=>$("results").appendChild(card(v)));$("more").style.display=token?"block":"none"
 }catch(e){$("results").innerHTML='<div class="status">সমস্যা: '+esc(e.message)+'</div>'}
}

/* Best-effort browser PiP:
   The official YouTube iframe remains the playback surface.
   Browser support varies, and cross-origin iframe PiP may be unavailable. */
async function pip(){
 const iframe=$("player");
 try{
   if(document.pictureInPictureEnabled && document.pictureInPictureElement){
      await document.exitPictureInPicture();return;
   }
   if(iframe.requestPictureInPicture){await iframe.requestPictureInPicture();return}
   alert("এই ব্রাউজার/YouTube player PiP সরাসরি সমর্থন করছে না। ফোনের system PiP support থাকলে সেটি ব্যবহার করুন।");
 }catch(e){alert("PiP এই player/browser-এ অনুমোদিত নয়।")}
}

function theme(){document.body.classList.toggle("light");localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark")}
if(localStorage.getItem("theme")==="light")document.body.classList.add("light");
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search(false)});
</script></body></html>
